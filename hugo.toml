baseURL = "https://chenzhuoji.github.io/"
title = "Chenzhuo's Blog"
theme = "PaperMod"
languageCode = "zh-cn"

[pagination]
  pagerSize = 10

# Markdown 渲染允许 HTML
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  defaultTheme = "auto"       # 自动切换深浅色
  showReadingTime = true      # 显示阅读时间
  showToc = true              # 显示文章目录
  tocOpen = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = "我听说过"
    url = "/posts/wo-ting-shuo-guo/"
    weight = 2


