<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ChenzhuoJi：文章与照片。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F3EB" />
    <meta name="application-name" content="ChenzhuoJi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChenzhuoJi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml" />
    <title>ChenzhuoJi</title>

    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('blog-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#141512' : '#F6F3EB')
        } catch (e) {}
      })()
    </script>

    <!-- 字体：英文自托管于 public/fonts/（见 src/fonts.css），中文依赖系统字体。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
